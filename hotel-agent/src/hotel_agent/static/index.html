<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>酒店管理 Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222d;
      --border: #2d3a4d;
      --text: #e8eef4;
      --muted: #8b9cb3;
      --accent: #3d9cf5;
      --accent-dim: #2563a8;
      --user-bubble: #243044;
      --agent-bubble: #152535;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: auto 1fr auto;
    }
    @media (max-width: 800px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
      aside { order: 2; border-right: none; border-bottom: 1px solid var(--border); max-height: 200px; }
      main { order: 3; }
    }
    header {
      grid-column: 1 / -1;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      background: linear-gradient(180deg, #141c26 0%, var(--bg) 100%);
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header .badge {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0.25rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    aside {
      grid-row: 2 / 4;
      border-right: 1px solid var(--border);
      padding: 1rem;
      overflow: auto;
      background: var(--panel);
    }
    aside h2 {
      margin: 0 0 0.75rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .room-list { list-style: none; margin: 0; padding: 0; }
    .room-list li {
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      margin-bottom: 0.35rem;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .status {
      font-size: 0.7rem;
      text-transform: uppercase;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
    }
    .status.occupied { background: #3d2a1f; color: #f0a868; }
    .status.vacant { background: #1f3d2a; color: #7dffc4; }
    .status.dirty { background: #3d3520; color: #e8d060; }
    .status.maintenance { background: #3d2035; color: #e888d0; }
    main {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 1rem 1.25rem;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border: 1px solid var(--border);
    }
    .msg.agent {
      align-self: flex-start;
      background: var(--agent-bubble);
      border: 1px solid var(--border);
    }
    .msg .label {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    footer {
      grid-column: 2 / -1;
      padding: 0.75rem 1.25rem 1.25rem;
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    @media (max-width: 800px) {
      footer { grid-column: 1 / -1; order: 4; }
    }
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 160px;
      resize: vertical;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 2px rgba(61, 156, 245, 0.2);
    }
    button {
      padding: 0.65rem 1.1rem;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0a0e12;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    select {
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
    }
    .hint { font-size: 0.8rem; color: var(--muted); }
    .err { color: #f08080; font-size: 0.85rem; margin-top: 0.25rem; }
    .add-room {
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
    }
    .add-room h3 {
      margin: 0 0 0.55rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .add-room input, .add-room select {
      width: 100%;
      margin-bottom: 0.45rem;
      padding: 0.45rem 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 0.82rem;
    }
    .add-room button {
      width: 100%;
      padding: 0.5rem 0.7rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>酒店管理 Agent</h1>
    <div class="toolbar">
      <span class="badge" id="modeHint">模式：自动</span>
      <label class="hint">回复模式
        <select id="modeSel" title="auto：有 API Key 用 LLM，否则演示">
          <option value="auto">自动</option>
          <option value="demo">演示</option>
          <option value="llm">LLM</option>
        </select>
      </label>
    </div>
  </header>
  <aside>
    <h2>房态</h2>
    <ul class="room-list" id="rooms"></ul>
    <div class="add-room">
      <h3>新增房间</h3>
      <input id="roomNumber" type="text" placeholder="房号，例如 301" />
      <input id="roomFloor" type="number" min="0" step="1" placeholder="楼层，例如 3" />
      <input id="roomType" type="text" placeholder="房型，例如 suite" />
      <select id="roomStatus">
        <option value="vacant">vacant</option>
        <option value="occupied">occupied</option>
        <option value="dirty">dirty</option>
        <option value="maintenance">maintenance</option>
      </select>
      <button type="button" id="addRoomBtn">添加房间</button>
    </div>
  </aside>
  <main>
    <p class="hint">输入自然语言，例如：列出所有房间、有哪些空房。配置 OPENAI_API_KEY 或 ARK_API_KEY 后可做预订、入住等全流程。</p>
    <div id="log"></div>
  </main>
  <footer>
    <textarea id="input" rows="2" placeholder="输入消息… Enter 发送，Shift+Enter 换行"></textarea>
    <button type="button" id="send">发送</button>
  </footer>
  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const roomsEl = document.getElementById("rooms");
    const modeSel = document.getElementById("modeSel");
    const modeHint = document.getElementById("modeHint");
    const roomNumberEl = document.getElementById("roomNumber");
    const roomFloorEl = document.getElementById("roomFloor");
    const roomTypeEl = document.getElementById("roomType");
    const roomStatusEl = document.getElementById("roomStatus");
    const addRoomBtn = document.getElementById("addRoomBtn");

    async function parseApiResponse(response) {
      const raw = await response.text();
      try {
        return raw ? JSON.parse(raw) : {};
      } catch (_) {
        return { detail: raw || "服务返回了非 JSON 响应" };
      }
    }

    function append(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "agent");
      const label = document.createElement("div");
      label.className = "label";
      label.textContent = role === "user" ? "你" : "Agent";
      div.appendChild(label);
      div.appendChild(document.createTextNode(text));
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function loadRooms() {
      try {
        const r = await fetch("/api/rooms");
        const data = await r.json();
        roomsEl.innerHTML = "";
        (data.rooms || []).forEach((room) => {
          const li = document.createElement("li");
          const left = document.createElement("span");
          left.textContent = room.number + " · " + room.room_type;
          const st = document.createElement("span");
          st.className = "status " + room.status;
          st.textContent = room.status;
          li.appendChild(left);
          li.appendChild(st);
          roomsEl.appendChild(li);
        });
      } catch (e) {
        roomsEl.innerHTML = "<li class=\"hint\">无法加载房态</li>";
      }
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      append("user", text);
      send.disabled = true;
      try {
        const mode = modeSel.value;
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, mode }),
        });
        const data = await parseApiResponse(r);
        if (!r.ok) {
          const d = data.detail;
          const msg = typeof d === "string" ? d : Array.isArray(d) ? d.map((x) => x.msg || JSON.stringify(x)).join("; ") : JSON.stringify(data);
          append("agent", msg);
        } else {
          modeHint.textContent = "模式：" + (data.mode === "llm" ? "LLM" : "演示");
          append("agent", data.reply);
          await loadRooms();
        }
      } catch (e) {
        append("agent", "请求失败：" + (e && e.message ? e.message : String(e)));
      }
      send.disabled = false;
      input.focus();
    }

    async function addRoom() {
      const number = roomNumberEl.value.trim();
      const floor = Number(roomFloorEl.value);
      const roomType = roomTypeEl.value.trim();
      const status = roomStatusEl.value;
      if (!number || !roomType || !Number.isInteger(floor) || floor < 0) {
        append("agent", "新增房间失败：请填写正确的房号、楼层和房型。");
        return;
      }
      addRoomBtn.disabled = true;
      try {
        const r = await fetch("/api/rooms", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number, floor, room_type: roomType, status }),
        });
        const data = await parseApiResponse(r);
        if (!r.ok) {
          const msg = typeof data.detail === "string" ? data.detail : "新增房间失败";
          append("agent", "新增房间失败：" + msg);
        } else {
          append("agent", "已新增房间 " + data.number + "（" + data.room_type + "）");
          roomNumberEl.value = "";
          roomFloorEl.value = "";
          roomTypeEl.value = "";
          roomStatusEl.value = "vacant";
          await loadRooms();
        }
      } catch (e) {
        append("agent", "新增房间失败：" + (e && e.message ? e.message : String(e)));
      }
      addRoomBtn.disabled = false;
    }

    send.addEventListener("click", sendMessage);
    addRoomBtn.addEventListener("click", addRoom);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    append("agent", "你好，我是酒店管理助手。左侧为实时房态，可直接在下方提问。");
    loadRooms();
    setInterval(loadRooms, 15000);
  </script>
</body>
</html>
