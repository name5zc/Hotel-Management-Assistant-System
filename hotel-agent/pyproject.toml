[project]
name = "hotel-agent"
version = "0.1.0"
description = "Hotel management agent with tool-calling and in-memory store"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
web = ["fastapi>=0.109", "uvicorn[standard]>=0.27", "pydantic>=2.0"]

[project.scripts]
hotel-agent = "hotel_agent.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hotel_agent = ["static/*.html"]
